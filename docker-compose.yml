version: '3.8'

services:
  # ─────────────────────────────────────
  # 메인 애플리케이션
  # ─────────────────────────────────────
  app:
    build: .
    container_name: wemeet-app
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=mistral
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=senior_care
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_USERNAME=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DATABASE=senior_care
      - POSTGRES_HOST=postgres
      - PORT=8080
    depends_on:
      - mongodb
      - redis
    networks:
      - wemeet-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────────────────
  # MongoDB (비정형 데이터베이스)
  # ─────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: wemeet-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - wemeet-network
    restart: unless-stopped

  # ─────────────────────────────────────
  # Redis (캐시/버퍼)
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wemeet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wemeet-network
    restart: unless-stopped

  # ─────────────────────────────────────
  # PostgreSQL (선택사항)
  # ─────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: wemeet-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=senior_care
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wemeet-network
    restart: unless-stopped

# ─────────────────────────────────────
# 볼륨
# ─────────────────────────────────────
volumes:
  mongodb_data:
  redis_data:
  postgres_data:

# ─────────────────────────────────────
# 네트워크
# ─────────────────────────────────────
networks:
  wemeet-network:
    driver: bridge